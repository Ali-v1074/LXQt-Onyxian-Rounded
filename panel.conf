[General]
__userfile__=true
iconTheme=
panels=panel1

[fancymenu2]
alignment=Left
buttonsAtTop=false
categoriesAtRight=true
customFont=false
customFontSize=11
favorites\size=0
icon=/usr/share/lxqt/graphics/helix.svg
menu_file=/etc/xdg/menus/lxqt-panel-applications.menu
ownIcon=false
showText=true
text=Menu
type=fancymenu

[panel1]
alignment=0
animation-duration=300
background-color=@Variant(\0\0\0\x43\0\xff\xff\0\0\0\0\0\0\0\0)
background-image=
desktop=0
font-color=@Variant(\0\0\0\x43\0\xff\xff\0\0\0\0\0\0\0\0)
hidable=false
hide-on-overlap=false
iconSize=24
lineCount=1
lockPanel=true
opacity=100
panelSize=64
plugins=fancymenu2, spacer, taskbar2, statusnotifier2, volume2, worldclock2
position=Bottom
reserve-space=true
screen-name=eDP-1
show-delay=300
visible-margin=true
width=100
width-percent=true

[spacer]
alignment=Left
size=14
type=spacer

[statusnotifier2]
alignment=Left
attentionPeriod=5
autoHideList=@Invalid()
hideList=firewall-applet, flameshot, CopyQ, blueman, smplayer, TelegramDesktop, screengrab, GPU Screen Recorder, qps, vlc, Proton VPN, warp-taskbar
reverseOrder=false
type=statusnotifier

[taskbar2]
alignment=Left
autoRotate=true
buttonHeight=50
buttonStyle=Icon
buttonWidth=55
closeOnMiddleClick=true
excludedList=
groupingEnabled=true
iconByClass=false
raiseOnCurrentDesktop=false
showDesktopNum=0
showGroupOnHover=true
showOnlyCurrentScreenTasks=false
showOnlyMinimizedTasks=false
showOnlyOneDesktopTasks=false
type=taskbar
ungroupedNextToExisting=false
wheelDeltaThreshold=300
wheelEventsAction=1

[volume2]
alignment=Right
device=1
type=volume
volumeAdjustStep=15

[worldclock2]
alignment=Right
autoRotate=true
customFormat="'<b>'HH:mm:ss'</b><br/><font size=\"-2\">'ddd, d MMM yyyy'<br/>'TT'</font>'"
dateFormatType=custom
dateLongNames=false
datePadDay=false
datePosition=below
dateShowDoW=false
dateShowYear=false
defaultTimeZone=
formatType=custom-timeonly
showDate=false
showTimezone=false
showTooltip=false
showWeekNumber=true
timeAMPM=true
timePadHour=true
timeShowSeconds=false
timeZoneWheel=true
timeZones\size=0
timezoneFormatType=iana
timezonePosition=below
type=worldclock
useAdvancedManualFormat=false
